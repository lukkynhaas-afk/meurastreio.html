<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreador BR — Sem API Paga</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 6px;
      color: #38bdf8;
    }
    .sub {
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid #334155;
      border-radius: 12px;
      background: #0f172a;
      color: #f1f5f9;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #7dd3fc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      display: none;
    }
    .result.show { display: block; }
    .carrier-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .badge-ok { background: #065f46; color: #6ee7b7; }
    .badge-err { background: #7f1d1d; color: #fca5a5; }
    .event {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 8px;
      border-left: 3px solid #38bdf8;
    }
    .event-desc { font-size: 0.9rem; color: #f1f5f9; margin-bottom: 4px; }
    .event-meta { font-size: 0.75rem; color: #94a3b8; }
    .error { color: #f87171; font-size: 0.9rem; }
    .hint { font-size: 0.72rem; color: #64748b; margin-top: 10px; text-align: center; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid #0f172a; border-top: 2px solid #38bdf8;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 Rastreador BR</h1>
    <p class="sub">Rastreamento direto no site — sem API paga</p>

    <label for="trackingInput">Código de rastreio</label>
    <input type="text" id="trackingInput" placeholder="Ex: AB123456789BR" autocomplete="off" />
    <button id="btnRastrear" onclick="rastrear()">Rastrear</button>

    <div id="resultado" class="result"></div>
    <p class="hint">Suporta Correios via Linketrack (API pública gratuita)</p>
  </div>

  <script>
    // ─── Proxy CORS gratuito (cors.lol) ───
    const CORS_PROXY = 'https://api.cors.lol/?url=';

    // ─── Detecção de transportadora por formato ───
    function detectarTransportadora(codigo) {
      const c = codigo.replace(/[\s\-\.]/g, '').toUpperCase();
      if (/^[A-Z]{2}\d{9}[A-Z]{2}$/.test(c)) return { nome: 'Correios', suportado: true };
      if (/^[A-Z]{2}\d{9,14}[A-Z]{0,2}$/.test(c)) return { nome: 'Correios (formato alternativo)', suportado: true };
      if (/^(TX|TE)[A-Z0-9]{8,14}$/i.test(c)) return { nome: 'Total Express', suportado: false };
      if (/^ML[A-Z0-9]{8,14}$/i.test(c)) return { nome: 'Mercado Envios', suportado: false };
      if (/^BR\d{10,16}$/.test(c)) return { nome: 'Shopee Xpress', suportado: false };
      if (/^(JT\d{10,16}|888\d{9,12})$/i.test(c)) return { nome: 'J&T Express', suportado: false };
      if (/^LG[A-Z0-9]{8,12}$/i.test(c)) return { nome: 'Loggi', suportado: false };
      if (/^(\d{14})$/i.test(c)) return { nome: 'Jadlog', suportado: false };
      return { nome: 'Transportadora não identificada', suportado: false };
    }

    // ─── Função principal ───
    async function rastrear() {
      const input = document.getElementById('trackingInput').value.trim();
      const resultado = document.getElementById('resultado');
      const btn = document.getElementById('btnRastrear');

      if (!input) {
        resultado.innerHTML = '<p class="error">⚠ Digite um código de rastreio.</p>';
        resultado.classList.add('show');
        return;
      }

      const codigoLimpo = input.replace(/[\s\-\.]/g, '').toUpperCase();
      const transportadora = detectarTransportadora(codigoLimpo);

      btn.disabled = true;
      resultado.innerHTML = '<span class="spinner"></span> Consultando...';
      resultado.classList.add('show');

      // Se não for suportado (não é Correios), mostra aviso
      if (!transportadora.suportado) {
        resultado.innerHTML = `
          <div class="carrier-name">${transportadora.nome}</div>
          <span class="badge badge-err">⚠ Rastreamento automático indisponível</span>
          <p class="error">No momento, apenas os <b>Correios</b> podem ser rastreados automaticamente sem API paga.</p>
          <p class="hint">Código detectado: ${codigoLimpo}</p>
        `;
        btn.disabled = false;
        return;
      }

      try {
        // ─── Usa Linketrack via proxy CORS ───
        const linketrackUrl = `https://www.linketrack.com/${encodeURIComponent(codigoLimpo)}/json`;
        const url = CORS_PROXY + encodeURIComponent(linketrackUrl);

        const response = await fetch(url);
        const data = await response.json();

        // Verifica se retornou dados válidos
        if (!data || !data.events || data.events.length === 0) {
          resultado.innerHTML = `
            <div class="carrier-name">Correios</div>
            <span class="badge badge-err">❌ Nenhum evento encontrado</span>
            <p class="error">Verifique se o código está correto ou tente novamente mais tarde.</p>
          `;
          btn.disabled = false;
          return;
        }

        // ─── Monta a lista de eventos ───
        let html = `<div class="carrier-name">Correios</div>`;
        html += `<span class="badge badge-ok">✅ ${data.events.length} evento(s)</span>`;

        // Ordena do mais recente para o mais antigo (a API já costuma vir assim)
        const eventos = data.events;
        for (const ev of eventos) {
          const dataHora = ev.date || ev.data || '';
          const local = ev.location || ev.local || '';
          const descricao = ev.status || ev.description || ev.descricao || 'Evento';

          html += `
            <div class="event">
              <div class="event-desc">${descricao}</div>
              <div class="event-meta">📍 ${local || 'Local não informado'} &nbsp;|&nbsp; 🕐 ${dataHora}</div>
            </div>
          `;
        }

        html += `<p class="hint">Código: ${codigoLimpo} · Fonte: Linketrack</p>`;
        resultado.innerHTML = html;

      } catch (err) {
        console.error(err);
        resultado.innerHTML = `
          <div class="carrier-name">Correios</div>
          <span class="badge badge-err">❌ Falha na consulta</span>
          <p class="error">Não foi possível obter os dados. Verifique sua internet ou tente novamente.</p>
          <p class="hint">Detalhe: ${err.message}</p>
        `;
      } finally {
        btn.disabled = false;
      }
    }

    // Enter para rastrear
    document.getElementById('trackingInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') rastrear();
    });
  </script>
</body>
</html>
